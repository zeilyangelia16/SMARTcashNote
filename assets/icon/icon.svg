<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="transparent"/>
  
  <!-- Rounded background -->
  <circle cx="512" cy="512" r="480" fill="#4F46E5" opacity="0.08"/>
  
  <!-- Main Wallet -->
  <g>
    <!-- Wallet body -->
    <path d="M 220 350 Q 220 300 270 300 L 650 300 Q 700 300 700 350 L 700 680 Q 700 730 650 730 L 270 730 Q 220 730 220 680 Z" 
          fill="#4F46E5" stroke="none"/>
    
    <!-- Wallet flap -->
    <path d="M 240 320 Q 240 280 280 280 L 480 280 Q 510 280 510 310 L 510 340 Q 510 355 495 357 L 250 357 Q 240 355 240 345 Z" 
          fill="#4F46E5" opacity="0.88" stroke="none"/>
    
    <!-- Inner shadow highlight -->
    <rect x="250" y="370" width="400" height="320" rx="18" fill="white" opacity="0.12"/>
  </g>
  
  <!-- Letter "C" - Large and Bold -->
  <g>
    <!-- Outer C arc -->
    <path d="M 340 380 Q 300 380 300 512 Q 300 644 340 644 L 385 644" 
          stroke="white" stroke-width="75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner C glow -->
    <path d="M 340 415 Q 325 415 325 512 Q 325 609 340 609" 
          stroke="white" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.25"/>
  </g>
  
  <!-- Growth Chart - Upward Trend -->
  <g>
    <!-- Chart background (subtle) -->
    <rect x="430" y="380" width="220" height="260" rx="15" fill="white" opacity="0.08"/>
    
    <!-- Bar 1 -->
    <rect x="460" y="560" width="30" height="70" rx="8" fill="white" opacity="0.7"/>
    
    <!-- Bar 2 -->
    <rect x="510" y="510" width="30" height="120" rx="8" fill="white" opacity="0.8"/>
    
    <!-- Bar 3 -->
    <rect x="560" y="450" width="30" height="180" rx="8" fill="white" opacity="0.9"/>
    
    <!-- Bar 4 (Tallest) -->
    <rect x="610" y="385" width="30" height="245" rx="8" fill="white" opacity="1"/>
    
    <!-- Trend line connecting bars -->
    <polyline points="475,560 525,510 575,450 625,385" 
              stroke="white" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
    
    <!-- Upward arrow accent -->
    <path d="M 625 360 L 625 330 M 625 330 L 610 350 M 625 330 L 640 350" 
          stroke="white" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
  
  <!-- Coin accent (representing wallet value) -->
  <g>
    <!-- Coin circle -->
    <circle cx="300" cy="620" r="40" fill="white" opacity="0.2"/>
    <circle cx="300" cy="620" r="30" fill="white" opacity="0.08"/>
    
    <!-- Dollar symbol inside -->
    <text x="300" y="635" font-size="45" font-weight="bold" fill="white" opacity="0.3" text-anchor="middle" font-family="Arial">$</text>
  </g>
  
  <!-- Decorative corner elements -->
  <circle cx="740" cy="330" r="28" fill="white" opacity="0.1"/>
  <circle cx="240" cy="770" r="24" fill="white" opacity="0.08"/>
  
  <!-- Premium accent line -->
  <line x1="220" y1="720" x2="380" y2="720" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
</svg>